services:
  openchamber:
    build:
      context: .
      dockerfile: Dockerfile.openchamber
    container_name: openchamber
    restart: unless-stopped

    ports:
      - "127.0.0.1:${OPENCHAMBER_PORT}:${OPENCHAMBER_PORT}"
      # OpenCode/OpenAI browser auth devuelve siempre a localhost:1455/auth/callback.
      # Debe estar publicado aunque la UI de OpenChamber use otro puerto.
      - "127.0.0.1:1455:1455"

    env_file:
      - .env

    environment:
      - OPENCHAMBER_UI_PASSWORD=${UI_PASSWORD}
      - PORT=${OPENCHAMBER_PORT}
      - OPENCODE_BINARY=/usr/local/bin/opencode

    volumes:
      - ${CONFIG_PATH:-./data/config}:/root/.config/opencode
      - ${DATA_PATH:-./data/app}:/root/.config/openchamber
      - ./data/auth:/root/.local/share/opencode
      - ${WORKSPACE_PATH}:/workspace

    working_dir: /workspace

    command: >
      sh -c "
        bootstrap-opencode-config /root/.config/opencode /opt/openchamber/config-template &&
        configure-git-safe-directories /workspace &&
        exec openchamber --host 0.0.0.0 --port ${OPENCHAMBER_PORT} --ui-password ${UI_PASSWORD} --no-daemon
      "
